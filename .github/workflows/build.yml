name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build static web app
        run: npm run build

      - name: Sync Android WebView assets
        run: npm run build:android-assets

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android lint
        if: always()
        working-directory: android
        run: gradle --no-daemon lintDebug

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload web build and APK
        uses: actions/upload-artifact@v4
        with:
          name: multi-hf-build
          if-no-files-found: error
          path: |
            dist/
            android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: multi-hf-build
          path: build-output

      - name: Publish versioned release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          tag="v${version}"
          apk="build-output/android/app/build/outputs/apk/debug/app-debug.apk"
          name="Multi-HF-v${version}-debug.apk"
          test -f "$apk" || { echo "APK missing at $apk"; exit 1; }

          if exists="$(curl -sSf -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            if jq -e --arg n "$name" '.assets[]? | select(.name == $n)' <<<"$exists" >/dev/null; then
              echo "Release $tag already has $name."
              exit 0
            fi
            upload_url="$(jq -r '.upload_url | sub("\\{[^}]*\\}$";"")' <<<"$exists")"
          else
            payload="$(jq -nc --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg n "Multi-HF $tag" \
              '{tag_name:$tag,name:$n,target_commitish:$sha,draft:false,prerelease:false,generate_release_notes:true}')"
            created="$(curl -sSf -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" -d "$payload" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases")"
            upload_url="$(jq -r '.upload_url | sub("\\{[^}]*\\}$";"")' <<<"$created")"
          fi

          curl -sSf -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$apk" "${upload_url}?name=${name}"
