name: Import verified Multi-HF source
on:
  push:
    branches: [main]
    paths:
      - '.multi-hf-transfer/READY'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore and publish source commit
        shell: bash
        run: |
          set -euo pipefail
          cat .multi-hf-transfer/bundle-*.b64 | base64 --decode > /tmp/Multi-HF-Clean.bundle
          git bundle verify /tmp/Multi-HF-Clean.bundle
          git fetch /tmp/Multi-HF-Clean.bundle refs/heads/main:refs/heads/import-source
          git push --force origin refs/heads/import-source:refs/heads/main
          git fetch origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "7e62747bb5795d5544bd9defd83867add26f70c1"
          test "$(git ls-tree -r --name-only refs/remotes/origin/main | wc -l | tr -d ' ')" = "64"
