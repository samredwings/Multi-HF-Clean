name: Import verified Multi-HF source bundle

on:
  push:
    branches: [main]
    paths:
      - '.multi-hf-transfer/READY'

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message || '', '[source-published]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and publish complete source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle='/tmp/Multi-HF-Clean.bundle'
          cat .multi-hf-transfer/bundle-*.b64 | base64 --decode > "$bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/heads/import-source
          target_sha="$(git rev-parse refs/heads/import-source)"
          for path in \
            index.html package.json package-lock.json \
            src/app.js src/lib/queue.js src/lib/protocol.js src/lib/state.js \
            src/lib/hosts.js src/lib/util.js src/lib/android-bridge.js \
            scripts/check.mjs scripts/build.mjs scripts/preview.mjs \
            scripts/build-android-assets.mjs test/queue.test.js \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/com/samredwings/multihf/MainActivity.kt; do
            git cat-file -e "$target_sha:$path"
          done
          git push --force origin refs/heads/import-source:refs/heads/main
          git fetch origin main
          actual_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$actual_sha" = "$target_sha"
          echo "Published complete source commit: $actual_sha"
