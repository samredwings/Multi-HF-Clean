name: Import verified Multi-HF source archive

on:
  push:
    branches: [main]
    paths:
      - '.multi-hf-transfer/READY'
      - '.multi-hf-transfer/source.zip'

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message || '', '[source-published]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify transfer chunks and archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          transfer_dir='.multi-hf-transfer'
          expected_chunks=15
          shopt -s nullglob
          files=( "${transfer_dir}"/chunk-*.b64 )
          if (( ${#files[@]} != expected_chunks )); then
            echo "Expected ${expected_chunks} chunks; found ${#files[@]}." >&2
            exit 1
          fi
          for index in $(seq -w 1 "$expected_chunks"); do
            expected="${transfer_dir}/chunk-${index}.b64"
            [[ -f "$expected" ]] || { echo "Missing $expected" >&2; exit 1; }
          done
          archive='/tmp/Multi-HF-v0.2.1-fixed.zip'
          mapfile -t files < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          cat "${files[@]}" | tr -d '\r\n\t ' | base64 --decode > "$archive"
          unzip -tq "$archive"
          listing="$(unzip -Z1 "$archive")"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' <<<"$listing"; then
            echo 'Archive contains an unsafe path.' >&2
            exit 1
          fi
          source_dir='/tmp/multi-hf-source'
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"
          for file in \
            package.json package-lock.json index.html src/app.js src/styles.css \
            src/lib/queue.js src/lib/protocol.js src/lib/state.js \
            src/lib/hosts.js src/lib/util.js src/lib/android-bridge.js \
            scripts/check.mjs scripts/build.mjs scripts/build-android-assets.mjs \
            test/queue.test.js test/protocol.test.js test/state.test.js \
            .github/workflows/build.yml \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/com/samredwings/multihf/MainActivity.kt; do
            test -f "$source_dir/$file" || { echo "Missing required source file: $file" >&2; exit 1; }
          done
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Test source before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/multi-hf-source
          npm ci
          npm test
          npm run check
          npm run build
          npm audit

      - name: Replace repository with verified source
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.multi-hf-transfer/' \
            --exclude='.github/workflows/import-source.yml' \
            /tmp/multi-hf-source/ ./
          rm -rf .multi-hf-transfer
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import complete Multi-HF v0.2.1 source [source-published]"
          git push --force-with-lease="refs/heads/main:${EXPECTED_MAIN_SHA}" origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
